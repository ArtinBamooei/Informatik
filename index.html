<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070a13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>مسیر یادگیری من</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{--txt:#e9edf7;--muted:#8b95ad;--stroke:rgba(255,255,255,.1)}
  html{scroll-behavior:smooth}
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
    background:#070a13;color:var(--txt);min-height:100vh;
    padding:20px 14px 40px;
    overflow-x:hidden;-webkit-font-smoothing:antialiased;
  }
  body::before{
    content:'';position:fixed;inset:0;z-index:-1;
    background:
      radial-gradient(600px 400px at 85% -10%, rgba(99,102,241,.28), transparent 65%),
      radial-gradient(500px 380px at 5% 5%, rgba(34,211,238,.15), transparent 65%),
      radial-gradient(600px 500px at 50% 110%, rgba(168,85,247,.2), transparent 65%),
      #070a13;
  }

  header{max-width:640px;margin:0 auto 18px;text-align:center}
  .eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;
    color:#a7b2cc;background:rgba(255,255,255,.05);border:1px solid var(--stroke);
    padding:6px 14px;border-radius:99px;margin-bottom:14px}
  .eyebrow .dot{width:6px;height:6px;border-radius:50%;background:#34d399;
    box-shadow:0 0 8px #34d399;animation:pulse 2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}
  h1{
    font-size:clamp(24px,6.5vw,34px);font-weight:900;line-height:1.35;
    color:#a78bfa;
    background-image:linear-gradient(110deg,#60a5fa,#a78bfa,#f472b6,#22d3ee,#60a5fa);
    background-size:300% 100%;
    -webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;
    animation:hue 9s linear infinite;
  }
  @keyframes hue{to{background-position:300% 0}}

  .overall{max-width:640px;margin:0 auto;padding:16px 18px;border-radius:18px;
    border:1px solid var(--stroke);
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02))}
  .oh{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
  .oh .lb{font-size:13.5px;font-weight:600;color:#cbd5e6;display:flex;align-items:center;gap:8px}
  .oh .ico{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:14px;
    background:rgba(96,165,250,.16);border:1px solid rgba(96,165,250,.34)}
  .opct{font-size:20px;font-weight:900;font-variant-numeric:tabular-nums;color:#a78bfa}
  .otrack{height:11px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
  .ofill{height:100%;width:0;border-radius:99px;
    background:linear-gradient(90deg,#22d3ee,#60a5fa,#a78bfa,#f472b6);
    background-size:200% 100%;animation:hue 6s linear infinite;
    box-shadow:0 0 20px -2px rgba(96,165,250,.8);
    transition:width .9s cubic-bezier(.22,.85,.25,1)}
  .ostats{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px;
    font-size:11.5px;color:var(--muted);font-weight:500}
  .ostats b{color:#e9edf7;font-weight:700}

  .grid{max-width:640px;margin:18px auto 0;display:flex;flex-direction:column;gap:12px}

  .card{
    position:relative;padding:16px;border-radius:18px;border:1px solid var(--stroke);
    background:linear-gradient(160deg,rgba(255,255,255,.075),rgba(255,255,255,.02));
    overflow:hidden;
    animation:cardIn .55s cubic-bezier(.2,.8,.2,1) backwards;
  }
  @keyframes cardIn{
    from{opacity:0;transform:translateY(16px) scale(.97)}
    to{opacity:1;transform:none}
  }
  .card.done{border-color:rgba(52,211,153,.45);
    box-shadow:0 0 26px -10px rgba(52,211,153,.55)}

  .ctop{display:flex;align-items:center;gap:11px;margin-bottom:12px}
  .icon{flex:0 0 auto;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;
    font-size:21px;background:rgba(255,255,255,.06);
    border:1px solid rgba(255,255,255,.1);
    transition:background .3s,border-color .3s,box-shadow .3s}
  .meta{flex:1;min-width:0}
  .meta h3{font-size:15.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pct{flex:0 0 auto;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums;
    transition:color .3s}

  .track{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}
  .fill{height:100%;width:0;border-radius:99px;
    transition:width .8s cubic-bezier(.22,.85,.25,1),background .3s,box-shadow .3s}

  .states{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
  .st-btn{font-family:inherit;font-size:11.5px;font-weight:700;color:#7c8aa5;
    background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
    padding:9px 2px;border-radius:10px;cursor:pointer;
    transition:all .2s ease;letter-spacing:-.2px}
  .st-btn:active{transform:scale(.93)}
  .st-btn.active{color:#0a0e18;font-weight:800}

  .tools{max-width:640px;margin:24px auto 0;display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .tool{font-family:inherit;font-size:12px;font-weight:600;color:#8b95ad;
    background:rgba(255,255,255,.04);border:1px solid var(--stroke);
    padding:9px 16px;border-radius:99px;cursor:pointer;
    display:inline-flex;align-items:center;gap:6px;transition:all .25s ease}
  .tool:active{transform:scale(.95)}
  .tool.danger:hover{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.08)}

  footer{max-width:640px;margin:26px auto 0;text-align:center;color:#5f6a82;font-size:11.5px}
  footer b{color:#94a3c4;font-weight:600}

  .toast{position:fixed;bottom:22px;left:50%;
    transform:translateX(-50%) translateY(80px);background:#1a2033;color:#e9edf7;
    font-size:12.5px;font-weight:600;padding:10px 18px;border-radius:99px;
    border:1px solid rgba(255,255,255,.12);box-shadow:0 10px 30px -10px rgba(0,0,0,.7);
    opacity:0;pointer-events:none;transition:all .35s cubic-bezier(.2,.8,.2,1);z-index:99;
    white-space:nowrap}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<header>
  <div class="eyebrow"><span class="dot"></span> پیشرفتت خودکار ذخیره می‌شه</div>
  <h1>مسیر یادگیری من</h1>
</header>

<section class="overall">
  <div class="oh">
    <div class="lb"><span class="ico">🎯</span> پیشرفت کلی</div>
    <div class="opct" id="overallPct">۰٪</div>
  </div>
  <div class="otrack"><div class="ofill" id="overallFill"></div></div>
  <div class="ostats">
    <span>✅ تکمیل: <b id="statDone">۰</b></span>
    <span>📘 در جریان: <b id="statProgress">۰</b></span>
    <span>💤 شروع نشده: <b id="statTodo">۰</b></span>
  </div>
</section>

<main class="grid" id="grid"></main>

<div class="tools">
  <button class="tool" id="exportBtn">📤 پشتیبان‌گیری</button>
  <button class="tool" id="importBtn">📥 بازگردانی</button>
  <button class="tool danger" id="resetBtn">🔄 شروع مجدد</button>
</div>

<footer>مسیرت رو قدم‌به‌قدم بساز — <b id="count">۱۲</b> مهارت</footer>

<div class="toast" id="toast"></div>

<script>
(function(){
  'use strict';

  var STATUS = {
    todo:     { label: 'شروع',    value: 0,   color: '#64748b' },
    learning: { label: 'یادگیری', value: 40,  color: '#38bdf8' },
    practice: { label: 'تمرین',   value: 75,  color: '#a78bfa' },
    done:     { label: 'تکمیل',   value: 100, color: '#34d399' }
  };
  var ORDER = ['todo','learning','practice','done'];

  var SKILLS = [
    { id:'numpy',   name:'NumPy',            icon:'🔢' },
    { id:'pandas',  name:'Pandas',           icon:'🐼' },
    { id:'mpl',     name:'Matplotlib',       icon:'📈' },
    { id:'seaborn', name:'Seaborn',          icon:'🎨' },
    { id:'sql',     name:'SQL',              icon:'🗄️' },
    { id:'db',      name:'Database',         icon:'💾' },
    { id:'etl',     name:'ETL',              icon:'🔄' },
    { id:'api',     name:'API',              icon:'🔌' },
    { id:'docker',  name:'Docker',           icon:'🐳' },
    { id:'ml',      name:'Machine Learning', icon:'🤖' },
    { id:'powerbi', name:'Power BI',         icon:'📊' },
    { id:'git',     name:'Git / GitHub',     icon:'🌿' }
  ];

  var KEY = 'learning-path-v2';
  var state = {};

  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = JSON.parse(raw) || {};
  } catch(e) { state = {}; }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch(e){}
  }

  function vibrate(ms){
    try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
  }

  function toFa(n){
    try { return Number(n).toLocaleString('fa-IR'); } catch(e){ return String(n); }
  }

  var grid = document.getElementById('grid');

  // ساخت کارت‌ها
  for (var i = 0; i < SKILLS.length; i++) {
    var skill = SKILLS[i];
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = skill.id;
    card.style.animationDelay = (i * 40) + 'ms';

    var btnsHtml = '';
    for (var j = 0; j < ORDER.length; j++) {
      var k = ORDER[j];
      btnsHtml += '<button class="st-btn" data-st="' + k + '">' + STATUS[k].label + '</button>';
    }

    card.innerHTML =
      '<div class="ctop">' +
        '<div class="icon">' + skill.icon + '</div>' +
        '<div class="meta"><h3>' + skill.name + '</h3></div>' +
        '<div class="pct">۰٪</div>' +
      '</div>' +
      '<div class="track"><div class="fill"></div></div>' +
      '<div class="states">' + btnsHtml + '</div>';

    grid.appendChild(card);
  }

  document.getElementById('count').textContent = toFa(SKILLS.length);

  // اعمال وضعیت روی کارت
  function apply(card, st, animate){
    var s = STATUS[st] || STATUS.todo;
    var pct = card.querySelector('.pct');
    var fill = card.querySelector('.fill');
    var icon = card.querySelector('.icon');
    var btns = card.querySelectorAll('.st-btn');

    pct.textContent = toFa(s.value) + '٪';
    pct.style.color = s.color;
    pct.style.textShadow = '0 0 16px ' + s.color + '88';

    // رنگ آیکون
    icon.style.background = 'color-mix(in srgb, ' + s.color + ' 18%, transparent)';
    icon.style.borderColor = 'color-mix(in srgb, ' + s.color + ' 38%, transparent)';
    icon.style.boxShadow = '0 0 18px -6px ' + s.color;

    // پر کردن نوار
    if (animate) {
      requestAnimationFrame(function(){ fill.style.width = s.value + '%'; });
    } else {
      fill.style.width = s.value + '%';
    }

    if (st === 'done') {
      fill.style.background = 'linear-gradient(90deg,#6ee7b7,#34d399)';
      fill.style.boxShadow = '0 0 16px -2px #34d399';
      card.classList.add('done');
    } else {
      fill.style.background = 'linear-gradient(90deg,' + s.color + 'aa,' + s.color + ')';
      fill.style.boxShadow = '0 0 14px -2px ' + s.color;
      card.classList.remove('done');
    }

    // دکمه‌ها
    for (var b = 0; b < btns.length; b++) {
      var btn = btns[b];
      var isActive = btn.dataset.st === st;
      btn.classList.toggle('active', isActive);
      if (isActive) {
        btn.style.background = s.color;
        btn.style.borderColor = s.color;
        btn.style.boxShadow = '0 0 14px -3px ' + s.color;
      } else {
        btn.style.background = 'rgba(255,255,255,.04)';
        btn.style.borderColor = 'rgba(255,255,255,.08)';
        btn.style.boxShadow = 'none';
      }
    }
  }

  // تنظیم وضعیت
  function setStatus(id, st){
    state[id] = st;
    save();
    var card = grid.querySelector('.card[data-id="' + id + '"]');
    if (card) apply(card, st, true);
    updateOverall();
  }

  // پیشرفت کلی
  function updateOverall(){
    var total = 0, done = 0, prog = 0, todo = 0;
    for (var i = 0; i < SKILLS.length; i++) {
      var st = state[SKILLS[i].id] || 'todo';
      total += STATUS[st].value;
      if (st === 'done') done++;
      else if (st === 'learning' || st === 'practice') prog++;
      else todo++;
    }
    var o = Math.round(total / SKILLS.length);
    document.getElementById('overallPct').textContent = toFa(o) + '٪';
    document.getElementById('overallFill').style.width = o + '%';
    document.getElementById('statDone').textContent = toFa(done);
    document.getElementById('statProgress').textContent = toFa(prog);
    document.getElementById('statTodo').textContent = toFa(todo);
  }

  // نمایش اولیه‌ی کارت‌ها
  var cards = grid.querySelectorAll('.card');
  for (var c = 0; c < cards.length; c++) {
    var card = cards[c];
    var st = state[card.dataset.id] || 'todo';
    apply(card, st, false);
  }
  updateOverall();

  // رویداد کلیک روی دکمه‌ها
  grid.addEventListener('click', function(e){
    var btn = e.target.closest ? e.target.closest('.st-btn') : null;
    if (!btn) return;
    var card = btn.closest('.card');
    if (!card) return;
    setStatus(card.dataset.id, btn.dataset.st);
    vibrate(15);
  });

  // توست
  var toast = document.getElementById('toast');
  var toastTimer;
  function showToast(msg){
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ toast.classList.remove('show'); }, 2200);
  }

  // پشتیبان‌گیری
  document.getElementById('exportBtn').addEventListener('click', function(){
    var data = JSON.stringify(state);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(data).then(function(){
        showToast('✅ پشتیبان کپی شد');
      }).catch(function(){
        prompt('این متن رو کپی کن:', data);
      });
    } else {
      prompt('این متن رو کپی کن:', data);
    }
    vibrate(20);
  });

  // بازگردانی
  document.getElementById('importBtn').addEventListener('click', function(){
    var data = prompt('متن پشتیبان رو پیست کن:');
    if (!data) return;
    try {
      var parsed = JSON.parse(data);
      if (typeof parsed !== 'object' || parsed === null) throw 0;
      state = parsed;
      save();
      var cs = grid.querySelectorAll('.card');
      for (var i = 0; i < cs.length; i++) {
        apply(cs[i], state[cs[i].dataset.id] || 'todo', true);
      }
      updateOverall();
      showToast('✅ بازگردانی شد');
      vibrate(20);
    } catch(err) {
      showToast('❌ متن نامعتبر');
    }
  });

  // ریست
  document.getElementById('resetBtn').addEventListener('click', function(){
    if (!confirm('مطمئنی؟ همه‌ی پیشرفتت صفر می‌شه.')) return;
    state = {};
    save();
    var cs = grid.querySelectorAll('.card');
    for (var i = 0; i < cs.length; i++) {
      apply(cs[i], 'todo', true);
    }
    updateOverall();
    showToast('🔄 شروع مجدد');
    vibrate(25);
  });

  // ثبت Service Worker
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

})();
</script>

</body>
</html>
