<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090d">
<title>مسیر یادگیری</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#08090d;color:#f5f7fb;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px 14px 60px;transition:.3s}button,input,textarea{font:inherit}button{cursor:pointer;color:inherit}.wrap{max-width:760px;margin:auto}
header{text-align:center;margin-bottom:18px}.badge{display:inline-block;padding:6px 12px;border:1px solid #ffffff18;border-radius:99px;color:#9ca3af;font-size:11px}h1{margin:14px 0 4px;font-size:38px;background:linear-gradient(90deg,#fff,var(--accent,#8b5cf6),var(--accent2,#22d3ee),#fff);-webkit-background-clip:text;color:transparent}.sub{color:#737987;font-size:11px;letter-spacing:2px}
.panel,.card,.timer,.achievements,.quote{background:#ffffff08;border:1px solid #ffffff12;border-radius:20px;backdrop-filter:blur(18px)}
.panel{padding:18px;display:grid;grid-template-columns:125px 1fr;gap:20px;align-items:center}.ring{width:120px;height:120px;position:relative}.ring svg{width:100%;height:100%;transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:8}.track{stroke:#ffffff0d}.fill{stroke:var(--accent);stroke-linecap:round;stroke-dasharray:283;stroke-dashoffset:283;transition:.6s}.ringtext{position:absolute;inset:0;display:grid;place-content:center;text-align:center}.pct{font-size:27px;font-weight:800}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}.stat{padding:10px;border:1px solid #ffffff0d;border-radius:12px}.stat b{display:block;font-size:18px}.stat span{font-size:10px;color:#9298a8}.streak{color:#fbbf24!important}.quote{padding:13px 16px;margin-top:10px}.quote small{color:var(--accent2);font-size:10px}.quote p{margin:4px 0 0;font-size:12px;line-height:1.9}
.toolbar,.filters{display:flex;gap:7px;overflow:auto;scrollbar-width:none}.toolbar{margin-top:10px;flex-wrap:wrap}.filters{margin:10px 0 18px}.tool,.filter,.action,.status{background:#ffffff07;border:1px solid #ffffff12;border-radius:11px;padding:9px 12px;color:#a7adba;white-space:nowrap}.filter.active,.status.active{color:#fff;border-color:var(--accent);background:#8b5cf61a}
.section{margin-bottom:20px}.section-head{display:flex;align-items:center;gap:8px;margin:0 3px 9px}.bar{width:4px;height:17px;border-radius:5px;background:var(--cat)}.section-head h2{font-size:14px;flex:1}.cnt{font-size:10px;color:#818795}
.card{padding:14px;margin-bottom:8px;position:relative;transition:.2s}.card.dragging{opacity:.4}.card.dragover{border-color:var(--accent)}.card.done{border-color:#34d39955}.top{display:flex;align-items:center;gap:11px}.icon{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:#ffffff08;font-size:21px}.info{flex:1;min-width:0}.info h3{margin:0;font-size:15px}.state{font-size:10px;color:var(--status);margin-top:3px}.mini{width:50px;height:50px;position:relative}.mini svg{width:100%;height:100%;transform:rotate(-90deg)}.mini circle{fill:none;stroke-width:4}.mini .t{stroke:#ffffff0c}.mini .f{stroke:var(--status);stroke-dasharray:145;stroke-dashoffset:145;stroke-linecap:round;transition:.4s}.mini span{position:absolute;inset:0;display:grid;place-items:center;font-size:10px}.statuses{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:10px}.status{font-size:10px;padding:8px 2px}.tools2{display:flex;gap:5px;margin-top:6px}.action{font-size:10px;padding:7px 9px}.drag{margin-right:auto;color:#666;cursor:grab;padding:7px}.subtasks,.note{display:none;margin-top:9px;padding-top:9px;border-top:1px solid #ffffff0c}.subtasks.open,.note.open{display:block}.subadd{display:flex;gap:5px}.subadd input{flex:1;background:#ffffff06;border:1px solid #ffffff12;border-radius:9px;color:#fff;padding:8px;font-size:11px}.subrow{display:flex;gap:8px;align-items:center;padding:5px 0;font-size:11px}.subrow button{margin-right:auto;background:none;border:0;color:#777}.note textarea{width:100%;min-height:80px;background:#0003;border:1px solid #ffffff12;border-radius:10px;color:#fff;padding:9px;resize:vertical;font-size:11px}
.timer,.achievements{margin-top:18px;padding:16px}.timer h2,.achievements h2{font-size:14px;margin:0}.timerline{display:flex;align-items:center;gap:10px;margin-top:9px}.time{font-size:31px;font-weight:800;flex:1}.timer button{padding:8px 11px}.achgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:7px;margin-top:10px}.ach{padding:11px;border:1px solid #ffffff10;border-radius:14px;opacity:.4}.ach.unlocked{opacity:1;border-color:#34d39955}.ach b,.ach small{display:block}.ach b{font-size:11px;margin-top:4px}.ach small{font-size:9px;color:#8f95a3}.modal{display:none;position:fixed;inset:0;background:#000b;place-items:center;z-index:20;padding:15px}.modal.open{display:grid}.modalbox{width:min(520px,100%);background:#101218;border:1px solid #ffffff18;border-radius:20px;padding:16px}.themegrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}.theme{padding:12px;border:1px solid #ffffff18;border-radius:12px;background:#ffffff06;text-align:right}.toast{position:fixed;bottom:20px;left:50%;transform:translate(-50%,80px);opacity:0;background:#161922;border:1px solid #ffffff18;padding:10px 16px;border-radius:99px;z-index:50;font-size:11px;transition:.25s}.toast.show{transform:translate(-50%,0);opacity:1}.conf{position:fixed;width:7px;height:7px;z-index:49}
@media(max-width:560px){.panel{grid-template-columns:1fr;text-align:center}.ring{margin:auto}.stats{text-align:right}.statuses{grid-template-columns:1fr 1fr}.themegrid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="badge">● AUTO SAVED</div><h1>مسیر یادگیری</h1><div class="sub">LEARNING PATH</div></header>
<section class="panel"><div class="ring"><svg viewBox="0 0 100 100"><circle class="track" cx="50" cy="50" r="45"/><circle class="fill" id="overallRing" cx="50" cy="50" r="45"/></svg><div class="ringtext"><div class="pct" id="pct">0%</div><small>پیشرفت کل</small></div></div><div class="stats"><div class="stat"><b id="done">0</b><span>تکمیل شده</span></div><div class="stat"><b id="learning">0</b><span>در حال یادگیری</span></div><div class="stat"><b id="todo">0</b><span>شروع نشده</span></div><div class="stat"><b class="streak" id="streak">0</b><span>روز پیاپی</span></div></div></section>
<section class="quote"><small>نقل‌قول روزانه</small><p id="quote"></p></section>
<div class="toolbar"><button class="tool" id="timerJump">تایمر</button><button class="tool" id="achJump">دستاوردها</button><button class="tool" id="themeBtn">تم رنگی</button><button class="tool" id="backup">پشتیبان</button><button class="tool" id="restore">بازیابی</button><button class="tool" id="reset">ریست</button></div>
<div class="filters" id="filters"></div>
<div id="container"></div>
<section class="timer" id="timer"><h2>تایمر مطالعه</h2><div class="timerline"><div class="time" id="time">25:00</div><button class="tool" id="start">شروع</button><button class="tool" id="pause">توقف</button><button class="tool" id="timerReset">ریست</button></div></section>
<section class="achievements" id="achievements"><h2>نشان‌ها و دستاوردها</h2><div class="achgrid" id="achgrid"></div></section>
</div>
<div class="modal" id="modal"><div class="modalbox"><div style="display:flex;align-items:center"><b style="flex:1">تم رنگی</b><button class="tool" id="closeTheme">بستن</button></div><div class="themegrid" id="themegrid"></div></div></div>
<div class="toast" id="toast"></div>
<script>
'use strict';
const CATS=[['data','Python & Data','#22d3ee'],['db','Database & ETL','#3b82f6'],['devops','Backend & DevOps','#f59e0b'],['ml','ML & Business Intel','#ec4899']];
const SKILLS=[['numpy','data','NumPy','🔢'],['pandas','data','Pandas','🐼'],['mpl','data','Matplotlib','📈'],['seaborn','data','Seaborn','🎨'],['sql','db','SQL','🗄️'],['dbase','db','Database','💾'],['etl','db','ETL','🔄'],['api','devops','API','🔌'],['docker','devops','Docker','🐳'],['git','devops','Git / GitHub','🌿'],['ml','ml','Machine Learning','🤖'],['powerbi','ml','Power BI','📊']];
const STAT={todo:['شروع',0,'#717784'],learning:['یادگیری',40,'#22d3ee'],practice:['تمرین',75,'#a78bfa'],done:['تکمیل',100,'#34d399']};
const ICONS=['🔢','🐼','📈','🎨','🗄️','💾','🔄','🔌','🐳','🌿','🤖','📊','🧠','💻','📚','📝','🧪','⚙️','🛠️','🧩','📦','🔬','🖥️','🌐','🚀','🎯','📐','📋'];
const QUOTES=['پیشرفت کوچک روزانه از جهش‌های گاه‌به‌گاه پایدارتر است.','ثبات، مزیت رقابتی یادگیری است.','پروژه آزمون واقعی فهم است.','اول درست بفهم؛ بعد سریع اجرا کن.','یک ساعت عمیق از چند ساعت پراکنده ارزشمندتر است.','هر مهارت با تکرار از دانستن به توانستن تبدیل می‌شود.'];
const THEMES={violet:['#8b5cf6','#22d3ee','#08090d'],cyan:['#06b6d4','#3b82f6','#061014'],green:['#10b981','#22d3ee','#06100d'],rose:['#ec4899','#a78bfa','#10070d'],amber:['#f59e0b','#f97316','#100b05']};
const KEY='informatik-v7';
let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){s=null}
if(!s||typeof s!=='object')s={progress:{},notes:{},subs:{},order:SKILLS.map(x=>x[0]),dates:[],theme:'violet',unlocked:[]};
s.progress=s.progress||{};s.notes=s.notes||{};s.subs=s.subs||{};s.dates=Array.isArray(s.dates)?s.dates:[];s.order=Array.isArray(s.order)?s.order:SKILLS.map(x=>x[0]);
SKILLS.forEach(x=>{if(!s.progress[x[0]])s.progress[x[0]]='todo';if(!Array.isArray(s.subs[x[0]]))s.subs[x[0]]=[];if(!s.order.includes(x[0]))s.order.push(x[0])});
const skill=id=>SKILLS.find(x=>x[0]===id), cat=id=>CATS.find(x=>x[0]===id), esc=x=>String(x).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function save(){localStorage.setItem(KEY,JSON.stringify(s))}
function today(d=new Date()){return d.toISOString().slice(0,10)}
function mark(){const t=today();if(!s.dates.includes(t))s.dates.push(t);s.dates=s.dates.slice(-400);save()}
function streak(){let d=new Date(),n=0,set=new Set(s.dates);if(!set.has(today(d))){d.setDate(d.getDate()-1);if(!set.has(today(d)))return 0}while(set.has(today(d))){n++;d.setDate(d.getDate()-1)}return n}
function toast(m){const e=document.getElementById('toast');e.textContent=m;e.classList.add('show');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('show'),2200)}
function burst(el){const r=el.getBoundingClientRect();for(let i=0;i<28;i++){const p=document.createElement('i');p.className='conf';p.style.left=r.left+r.width/2+'px';p.style.top=r.top+r.height/2+'px';p.style.background=['#34d399','#22d3ee','#a78bfa','#f59e0b','#ec4899','#fff'][i%6];document.body.appendChild(p);const a=i*Math.PI*2/28,d=90+Math.random()*150;p.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px) rotate(500deg)`,opacity:0}],{duration:900+Math.random()*500}).onfinish=()=>p.remove()}}
function renderFilters(){const f=document.getElementById('filters');f.innerHTML='<button class="filter active" data-f="all">همه</button>'+CATS.map(c=>`<button class="filter" data-f="${c[0]}">${esc(c[1])}</button>`).join('');f.onclick=e=>{const b=e.target.closest('.filter');if(!b)return;f.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');render(b.dataset.f)}}
function card(x){const id=x[0],st=s.progress[id],q=STAT[st],subs=s.subs[id],subDone=subs.filter(a=>a.done).length;return `<article class="card" draggable="true" data-id="${id}" style="--status:${q[2]}"><div class="top"><div class="icon">${x[3]}</div><div class="info"><h3>${esc(x[2])}</h3><div class="state">${q[0]} ${subs.length?'· '+subDone+'/'+subs.length+' زیرموضوع':''}</div></div><div class="mini"><svg viewBox="0 0 52 52"><circle class="t" cx="26" cy="26" r="23"/><circle class="f" cx="26" cy="26" r="23"/></svg><span>${q[1]}%</span></div></div><div class="statuses">${Object.keys(STAT).map(k=>`<button class="status ${k===st?'active':''}" data-st="${k}" style="--status:${STAT[k][2]}">${STAT[k][0]}</button>`).join('')}</div><div class="tools2"><button class="action" data-a="sub">زیرموضوع‌ها</button><button class="action" data-a="note">یادداشت</button><button class="action" data-a="icon">آیکون</button><span class="drag">↕</span></div><div class="subtasks"><div class="subadd"><input placeholder="زیرموضوع جدید"><button class="action" data-a="add">افزودن</button></div>${subs.map((a,i)=>`<div class="subrow"><input type="checkbox" data-i="${i}" ${a.done?'checked':''}><span>${esc(a.text)}</span><button data-a="del" data-i="${i}">×</button></div>`).join('')}</div><div class="note"><textarea placeholder="یادداشت این مهارت...">${esc(s.notes[id]||'')}</textarea></div></article>`}
function render(filter='all'){const c=document.getElementById('container');c.innerHTML='';CATS.forEach(C=>{const ids=s.order.filter(id=>skill(id)&&skill(id)[1]===C[0]&&(filter==='all'||filter===C[0]));if(!ids.length)return;const sec=document.createElement('section');sec.className='section';sec.innerHTML=`<div class="section-head" style="--cat:${C[2]}"><span class="bar"></span><h2>${C[1]}</h2><span class="cnt"></span></div>`;ids.forEach(id=>{const d=document.createElement('div');d.innerHTML=card(skill(id));sec.appendChild(d.firstElementChild)});c.appendChild(sec);updateSection(sec,C[0])});animateRings()}
function updateSection(sec,cid){const ids=s.order.filter(id=>skill(id)&&skill(id)[1]===cid),done=ids.filter(id=>s.progress[id]==='done').length;sec.querySelector('.cnt').textContent=done+'/'+ids.length}
function animateRings(){document.querySelectorAll('.card').forEach(c=>{const v=STAT[s.progress[c.dataset.id]][1];c.querySelector('.f').style.strokeDashoffset=145*(1-v/100)})}
function overall(){let sum=0,d=0,l=0,t=0;SKILLS.forEach(x=>{const st=s.progress[x[0]],v=STAT[st][1];sum+=v;if(st==='done')d++;else if(st==='todo')t++;else l++});const p=Math.round(sum/SKILLS.length);document.getElementById('pct').textContent=p+'%';document.getElementById('overallRing').style.strokeDashoffset=283*(1-p/100);document.getElementById('done').textContent=d;document.getElementById('learning').textContent=l;document.getElementById('todo').textContent=t;document.getElementById('streak').textContent=streak()}
function status(id,st){const old=s.progress[id];if(old===st)return;s.progress[id]=st;mark();save();render(document.querySelector('.filter.active').dataset.f);overall();achievements();if(st==='done'&&old!=='done'){burst(document.querySelector('[data-id="'+id+'"]'));toast('مهارت تکمیل شد')}}
function addSub(id,text){if(!text.trim())return;s.subs[id].push({text:text.trim(),done:false});save();render(document.querySelector('.filter.active').dataset.f);openPanel(id,'sub')}
function openPanel(id,type){const c=document.querySelector('[data-id="'+id+'"]');if(c)c.querySelector(type==='sub'?'.subtasks':'.note').classList.add('open')}
document.getElementById('container').addEventListener('click',e=>{const c=e.target.closest('.card');if(!c)return;const id=c.dataset.id,b=e.target.closest('[data-st]');if(b){status(id,b.dataset.st);return}const a=e.target.closest('[data-a]');if(!a)return;const act=a.dataset.a;if(act==='sub'||act==='note'){c.querySelector(act==='sub'?'.subtasks':'.note').classList.toggle('open');return}if(act==='add'){addSub(id,c.querySelector('input[placeholder]').value);return}if(act==='del'){s.subs[id].splice(+a.dataset.i,1);save();render(document.querySelector('.filter.active').dataset.f);openPanel(id,'sub');return}if(act==='icon'){const sk=skill(id),i=ICONS.indexOf(sk[3]);sk[3]=ICONS[(i+1)%ICONS.length];save();render(document.querySelector('.filter.active').dataset.f);toast('آیکون تغییر کرد')}})
document.getElementById('container').addEventListener('change',e=>{const c=e.target.closest('.card');if(!c||!e.target.matches('[data-i]'))return;s.subs[c.dataset.id][+e.target.dataset.i].done=e.target.checked;save();render(document.querySelector('.filter.active').dataset.f);openPanel(c.dataset.id,'sub')})
document.getElementById('container').addEventListener('input',e=>{const c=e.target.closest('.card');if(c&&e.target.tagName==='TEXTAREA'){s.notes[c.dataset.id]=e.target.value;save()}})
let drag=null;document.getElementById('container').addEventListener('dragstart',e=>{const c=e.target.closest('.card');if(c){drag=c.dataset.id;c.classList.add('dragging')}});document.getElementById('container').addEventListener('dragend',e=>{e.target.closest('.card')?.classList.remove('dragging');drag=null});document.getElementById('container').addEventListener('dragover',e=>{if(drag)e.preventDefault()});document.getElementById('container').addEventListener('drop',e=>{const target=e.target.closest('.card');if(!drag||!target||target.dataset.id===drag)return;const a=s.order.indexOf(drag),b=s.order.indexOf(target.dataset.id);s.order.splice(a,1);s.order.splice(b,0,drag);save();render(document.querySelector('.filter.active').dataset.f);toast('ترتیب ذخیره شد')});
const ACH=[['first','🏁','شروع','اولین تغییر',()=>SKILLS.some(x=>s.progress[x[0]]!=='todo')],['three','📚','سه قدم','۳ مهارت فعال',()=>SKILLS.filter(x=>s.progress[x[0]]!=='todo').length>=3],['done1','✓','اولین تکمیل','یک مهارت کامل',()=>SKILLS.some(x=>s.progress[x[0]]==='done')],['done5','🏆','پنج‌تا','۵ مهارت کامل',()=>SKILLS.filter(x=>s.progress[x[0]]==='done').length>=5],['streak3','🔥','۳ روز','Streak سه‌روزه',()=>streak()>=3],['streak7','⚡','۷ روز','Streak هفت‌روزه',()=>streak()>=7],['all','👑','کامل','همه مهارت‌ها',()=>SKILLS.every(x=>s.progress[x[0]]==='done')]];
function achievements(){const box=document.getElementById('achgrid'),newOn=[];ACH.forEach(a=>{if(a[4]()&&!s.unlocked.includes(a[0])){s.unlocked.push(a[0]);newOn.push(a[2])}});box.innerHTML=ACH.map(a=>`<div class="ach ${s.unlocked.includes(a[0])?'unlocked':''}"><div>${a[1]}</div><b>${a[2]}</b><small>${a[3]}</small></div>`).join('');save();if(newOn.length)toast('دستاورد جدید: '+newOn[0])}
function applyTheme(){const t=THEMES[s.theme]||THEMES.violet;document.documentElement.style.setProperty('--accent',t[0]);document.documentElement.style.setProperty('--accent2',t[1]);document.body.style.background=t[2]}
document.getElementById('themeBtn').onclick=()=>document.getElementById('modal').classList.add('open');document.getElementById('closeTheme').onclick=()=>document.getElementById('modal').classList.remove('open');
document.getElementById('themegrid').innerHTML=Object.keys(THEMES).map(k=>`<button class="theme" data-theme="${k}"><b>${k}</b><small>تغییر رنگ رابط</small></button>`).join('');document.getElementById('themegrid').onclick=e=>{const b=e.target.closest('[data-theme]');if(!b)return;s.theme=b.dataset.theme;save();applyTheme();document.getElementById('modal').classList.remove('open')};
document.getElementById('timerJump').onclick=()=>document.getElementById('timer').scrollIntoView({behavior:'smooth'});document.getElementById('achJump').onclick=()=>document.getElementById('achievements').scrollIntoView({behavior:'smooth'});
document.getElementById('backup').onclick=async()=>{const text=JSON.stringify(s);try{await navigator.clipboard.writeText(text);toast('پشتیبان کپی شد')}catch(e){prompt('متن پشتیبان:',text)}};document.getElementById('restore').onclick=()=>{const x=prompt('متن پشتیبان را وارد کن:');if(!x)return;try{s=JSON.parse(x);save();render();overall();achievements();toast('بازیابی شد')}catch(e){toast('پشتیبان نامعتبر است')}};
document.getElementById('reset').onclick=()=>{if(!confirm('تمام پیشرفت، یادداشت‌ها و زیرموضوع‌ها حذف شوند؟'))return;s={progress:{},notes:{},subs:{},order:SKILLS.map(x=>x[0]),dates:[],theme:'violet',unlocked:[]};SKILLS.forEach(x=>{s.progress[x[0]]='todo';s.subs[x[0]]=[]});save();render();overall();achievements();toast('ریست شد')};
let seconds=1500,interval=null;function clock(){document.getElementById('time').textContent=String(Math.floor(seconds/60)).padStart(2,'0')+':'+String(seconds%60).padStart(2,'0')}document.getElementById('start').onclick=()=>{if(interval)return;mark();interval=setInterval(()=>{if(seconds<=0){clearInterval(interval);interval=null;toast('زمان مطالعه تمام شد');return}seconds--;clock()},1000)};document.getElementById('pause').onclick=()=>{clearInterval(interval);interval=null};document.getElementById('timerReset').onclick=()=>{clearInterval(interval);interval=null;seconds=1500;clock()};
const d=new Date();document.getElementById('quote').textContent='«'+QUOTES[(d.getFullYear()+d.getMonth()+1+d.getDate())%QUOTES.length]+'»';renderFilters();render();overall();achievements();applyTheme();clock();
</script>
</body></html>
