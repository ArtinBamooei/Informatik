<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050508">
<title>مسیر یادگیری</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Vazirmatn:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  :root{
    --text:#f5f5f7;
    --dim:#8b8b94;
    --dimmer:#4b4b52;
    --line:rgba(255,255,255,.07);
    --line-2:rgba(255,255,255,.04);

    --s-todo:#52525b;
    --s-learning:#22d3ee;
    --s-practice:#a78bfa;
    --s-done:#34d399;
  }
  html,body{background:#050508;color:var(--text);overflow-x:hidden;min-height:100vh}
  body{
    font-family:'Vazirmatn',system-ui,-apple-system,sans-serif;
    padding:max(28px,env(safe-area-inset-top)) 14px calc(56px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
    position:relative;
    transition:background .8s ease;
  }

  /* ═══════════ BACKDROP ═══════════ */
  .aurora{
    position:fixed;inset:0;z-index:-3;
    filter:blur(90px);opacity:.45;
    transition:opacity .8s ease,filter .8s ease;
    pointer-events:none;
  }
  .aurora i{position:absolute;border-radius:50%;mix-blend-mode:screen;display:block;
    transition:background 1.2s ease}
  .aurora i:nth-child(1){width:72vw;height:72vw;top:-18vw;right:-22vw;background:radial-gradient(circle,var(--a1,#7c3aed),transparent 70%);animation:drift1 24s ease-in-out infinite}
  .aurora i:nth-child(2){width:62vw;height:62vw;bottom:-22vw;left:-18vw;background:radial-gradient(circle,var(--a2,#06b6d4),transparent 70%);animation:drift2 30s ease-in-out infinite}
  .aurora i:nth-child(3){width:56vw;height:56vw;top:38%;left:26%;background:radial-gradient(circle,var(--a3,#ec4899),transparent 70%);animation:drift3 26s ease-in-out infinite}
  @keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-14vw,10vw) scale(1.22)}}
  @keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(12vw,-14vw) scale(1.18)}}
  @keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-10vw,-8vw) scale(1.25)}}

  .noise{
    position:fixed;inset:0;z-index:-2;pointer-events:none;opacity:.04;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  }

  .vignette{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background:radial-gradient(ellipse at 50% 0%,transparent 30%,rgba(0,0,0,.55) 100%);
  }

  /* ═══════════ HEADER ═══════════ */
  header{
    max-width:620px;margin:0 auto 26px;text-align:center;
    animation:up .9s cubic-bezier(.2,.8,.2,1) both;
  }
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-family:'Space Grotesk',monospace;
    font-size:10px;font-weight:700;letter-spacing:1.6px;text-transform:uppercase;
    color:var(--dim);
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    padding:8px 15px;border-radius:99px;
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    margin-bottom:20px;
  }
  .badge .pulse{
    width:6px;height:6px;border-radius:50%;background:#34d399;
    box-shadow:0 0 10px #34d399,0 0 20px #34d399;
    animation:blink 1.8s ease-in-out infinite;
  }
  @keyframes blink{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  h1{
    font-size:clamp(30px,9vw,42px);font-weight:900;line-height:1.2;letter-spacing:-.03em;
    background:linear-gradient(120deg,#fff 0%,#c4b5fd 25%,#67e8f9 50%,#f0abfc 75%,#fff 100%);
    background-size:250% 100%;
    -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
    animation:slide 8s linear infinite;
  }
  @keyframes slide{to{background-position:250% 0}}

  .sub{
    font-family:'Space Grotesk',monospace;
    font-size:11px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--dimmer);margin-top:10px;
  }

  /* ═══════════ HERO (Overall Progress) ═══════════ */
  .hero{
    max-width:620px;margin:0 auto 20px;position:relative;
    padding:26px 22px;border-radius:28px;
    background:
      radial-gradient(circle at 50% 0%,rgba(167,139,250,.14),transparent 60%),
      linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,.008));
    border:1px solid var(--line);
    backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
    overflow:hidden;
    animation:up .9s .1s cubic-bezier(.2,.8,.2,1) both;
    display:flex;align-items:center;gap:22px;
  }
  .hero::after{
    content:'';position:absolute;top:0;left:10%;right:10%;height:1px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  }

  .big-ring{position:relative;flex:0 0 auto;width:112px;height:112px}
  .big-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .big-ring .track{fill:none;stroke:rgba(255,255,255,.055);stroke-width:8}
  .big-ring .grad{fill:none;stroke-width:8;stroke-linecap:round;
    stroke-dasharray:283;stroke-dashoffset:283;
    transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.2,1);
    filter:drop-shadow(0 0 10px rgba(167,139,250,.7))}
  .big-ring .glow{fill:none;stroke-width:14;stroke-linecap:round;
    stroke-dasharray:283;stroke-dashoffset:283;
    transition:stroke-dashoffset 1.4s cubic-bezier(.2,.9,.2,1);
    opacity:.25;filter:blur(8px)}
  .big-ring .center{
    position:absolute;inset:0;display:grid;place-items:center;
  }
  .big-ring .center .pct{
    font-family:'Space Grotesk',monospace;
    font-size:30px;font-weight:700;line-height:1;letter-spacing:-.05em;
    color:#fff;
    text-shadow:0 0 30px rgba(167,139,250,.6);
  }
  .big-ring .center .lbl{
    font-family:'Space Grotesk',monospace;
    font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
    color:var(--dim);margin-top:4px;text-align:center;
  }

  .hero-meta{flex:1;min-width:0}
  .hero-meta .title{
    font-size:11px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;
    color:var(--dim);margin-bottom:14px;
  }
  .stats{display:flex;flex-direction:column;gap:9px}
  .stat{
    display:flex;align-items:center;gap:10px;
    font-family:'Space Grotesk',monospace;
    font-size:12px;font-weight:600;letter-spacing:.3px;
  }
  .stat .dot{
    width:8px;height:8px;border-radius:50%;flex:0 0 auto;
    position:relative;
  }
  .stat .dot::after{
    content:'';position:absolute;inset:-3px;border-radius:50%;
    background:inherit;opacity:.3;filter:blur(4px);
  }
  .stat.d1 .dot{background:var(--s-done)}
  .stat.d2 .dot{background:var(--s-learning)}
  .stat.d3 .dot{background:var(--s-todo)}
  .stat .lbl{color:var(--dim);flex:1}
  .stat .num{color:#fff;font-weight:700;font-size:14px}
  .stat.d1 .num{color:var(--s-done)}
  .stat.d2 .num{color:var(--s-learning)}

  /* ═══════════ FILTER CHIPS ═══════════ */
  .filters{
    max-width:620px;margin:0 auto 22px;
    display:flex;gap:8px;overflow-x:auto;
    padding:4px 2px 8px;scrollbar-width:none;
    animation:up .9s .2s cubic-bezier(.2,.8,.2,1) both;
    -webkit-overflow-scrolling:touch;
  }
  .filters::-webkit-scrollbar{display:none}
  .filter{
    flex:0 0 auto;
    font-family:'Vazirmatn',inherit;
    font-size:12px;font-weight:700;
    color:var(--dim);
    background:rgba(255,255,255,.03);
    border:1px solid var(--line);
    padding:9px 16px;border-radius:99px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:all .3s cubic-bezier(.2,.9,.2,1);
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
    white-space:nowrap;
    -webkit-user-select:none;user-select:none;
  }
  .filter .cdot{width:7px;height:7px;border-radius:50%;transition:box-shadow .3s ease}
  .filter:active{transform:scale(.94)}
  .filter.active{color:#fff;background:rgba(255,255,255,.08);
    border-color:rgba(255,255,255,.2);
    box-shadow:0 4px 20px -6px rgba(255,255,255,.15)}
  .filter.active .cdot{box-shadow:0 0 10px currentColor}

  /* ═══════════ SECTIONS & CARDS ═══════════ */
  .container{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:26px}

  .section{
    transition:opacity .4s ease,transform .4s ease;
  }
  .section.hide{display:none}

  .section-head{
    display:flex;align-items:center;gap:10px;
    margin:0 4px 12px;
    animation:up .7s cubic-bezier(.2,.8,.2,1) both;
  }
  .section-head .bar{
    width:3px;height:16px;border-radius:99px;
    background:var(--cat-color,#fff);
    box-shadow:0 0 12px var(--cat-color);
  }
  .section-head h2{
    font-size:13px;font-weight:800;letter-spacing:-.01em;
    color:#e4e4e7;
    flex:1;
  }
  .section-head .cnt{
    font-family:'Space Grotesk',monospace;
    font-size:11px;font-weight:700;
    color:var(--dim);
    background:rgba(255,255,255,.04);
    border:1px solid var(--line-2);
    padding:3px 9px;border-radius:99px;
  }

  .card{
    position:relative;
    padding:16px;
    border-radius:22px;
    background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.008));
    border:1px solid var(--line);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    overflow:hidden;
    margin-bottom:10px;

    opacity:0;transform:translateY(18px) scale(.98);
    transition:
      opacity .7s cubic-bezier(.2,.9,.2,1),
      transform .7s cubic-bezier(.2,.9,.2,1),
      border-color .4s ease,
      box-shadow .4s ease;
  }
  .card.in{opacity:1;transform:none}
  .card::before{
    content:'';position:absolute;top:0;left:8%;right:8%;height:1px;
    background:linear-gradient(90deg,transparent,var(--sc),transparent);
    opacity:.35;
    transition:opacity .4s ease;
  }
  .card.done{
    border-color:color-mix(in srgb,var(--sc) 30%,transparent);
    box-shadow:0 0 40px -14px var(--sc),0 0 0 1px color-mix(in srgb,var(--sc) 20%,transparent) inset;
  }
  .card.done::before{opacity:1;box-shadow:0 0 12px var(--sc)}
  .card::after{
    content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;
    background:radial-gradient(320px 100px at 95% -10%,var(--glow),transparent 65%);
    opacity:.65;
    transition:opacity .4s ease;
  }
  .card.done::after{opacity:1}

  .card-top{position:relative;z-index:1;display:flex;align-items:center;gap:13px}
  .ic{
    flex:0 0 auto;width:44px;height:44px;border-radius:13px;
    display:grid;place-items:center;font-size:22px;
    background:rgba(255,255,255,.045);
    border:1px solid rgba(255,255,255,.07);
    transition:all .5s cubic-bezier(.2,1.6,.4,1);
  }
  .card.done .ic{
    background:var(--glow);
    border-color:color-mix(in srgb,var(--sc) 40%,transparent);
    box-shadow:0 0 22px -6px var(--sc);
  }

  .info{flex:1;min-width:0}
  .info h3{
    font-size:15.5px;font-weight:700;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .stat-line{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Space Grotesk',monospace;
    font-size:10px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;
    color:var(--sc);margin-top:4px;
    transition:color .3s ease;
  }
  .stat-line::before{
    content:'';width:5px;height:5px;border-radius:50%;background:var(--sc);
    box-shadow:0 0 8px var(--sc);
    transition:all .3s ease;
  }
  .stat-line.done::before{animation:blink 1.6s ease-in-out infinite}

  /* Mini ring */
  .mini-ring{position:relative;flex:0 0 auto;width:52px;height:52px}
  .mini-ring svg{width:100%;height:100%;transform:rotate(-90deg);overflow:visible}
  .mini-ring .t{fill:none;stroke:rgba(255,255,255,.06);stroke-width:3.5}
  .mini-ring .f{fill:none;stroke:var(--sc);stroke-width:3.5;stroke-linecap:round;
    stroke-dasharray:144.5;stroke-dashoffset:144.5;
    transition:stroke-dashoffset 1.1s cubic-bezier(.2,.9,.2,1),stroke .4s ease;
    filter:drop-shadow(0 0 5px var(--sc))}
  .mini-ring .n{
    position:absolute;inset:0;display:grid;place-items:center;
    font-family:'Space Grotesk',monospace;
    font-size:12px;font-weight:700;letter-spacing:-.04em;
    color:#e4e4e7;
  }

  /* Buttons */
  .btns{
    position:relative;z-index:1;
    display:grid;grid-template-columns:repeat(4,1fr);gap:5px;
    margin-top:14px;
  }
  .b{
    font-family:'Vazirmatn',inherit;
    font-size:11px;font-weight:700;letter-spacing:-.3px;
    color:#71717a;
    background:rgba(255,255,255,.025);
    border:1px solid rgba(255,255,255,.055);
    padding:11px 3px;
    border-radius:11px;
    cursor:pointer;
    transition:all .28s cubic-bezier(.2,.9,.2,1);
    position:relative;overflow:hidden;
    -webkit-user-select:none;user-select:none;
  }
  .b:active{transform:scale(.92)}
  .b::after{
    content:'';position:absolute;inset:0;border-radius:inherit;
    background:radial-gradient(circle at center,var(--bc),transparent 70%);
    opacity:0;transform:scale(.2);
    transition:opacity .35s ease,transform .35s ease;
    pointer-events:none;
  }
  .b.active::after{opacity:.22;transform:scale(1.6)}
  .b.active{
    color:var(--bc);
    border-color:color-mix(in srgb,var(--bc) 45%,transparent);
    background:color-mix(in srgb,var(--bc) 7%,transparent);
    box-shadow:0 0 20px -6px var(--bc),inset 0 0 14px -8px var(--bc);
    text-shadow:0 0 12px var(--bc);
  }

  /* ═══════════ TOOLS ═══════════ */
  .tools{
    max-width:620px;margin:32px auto 0;
    display:flex;gap:8px;justify-content:center;flex-wrap:wrap;
    animation:up .9s .4s cubic-bezier(.2,.8,.2,1) both;
  }
  .tool{
    font-family:'Space Grotesk',monospace;
    font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    color:#71717a;
    background:rgba(255,255,255,.025);
    border:1px solid var(--line);
    padding:11px 15px;border-radius:99px;
    cursor:pointer;
    display:inline-flex;align-items:center;gap:7px;
    transition:all .3s ease;
    backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  }
  .tool:hover{color:#f5f5f7;border-color:rgba(255,255,255,.2);background:rgba(255,255,255,.05)}
  .tool:active{transform:scale(.93)}
  .tool.danger:hover{color:#f87171;border-color:rgba(248,113,113,.4);background:rgba(248,113,113,.06)}

  footer{
    max-width:620px;margin:36px auto 0;text-align:center;
    font-family:'Space Grotesk',monospace;
    font-size:9.5px;font-weight:500;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--dimmer);
    animation:up .9s .5s cubic-bezier(.2,.8,.2,1) both;
  }

  /* ═══════════ TOAST ═══════════ */
  .toast{
    position:fixed;bottom:calc(24px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(90px);
    background:rgba(18,18,22,.92);color:#f5f5f7;
    font-family:'Space Grotesk',monospace;
    font-size:11.5px;font-weight:600;letter-spacing:.6px;
    padding:13px 22px;border-radius:99px;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 20px 60px -20px rgba(0,0,0,.9),0 0 30px -12px rgba(167,139,250,.4);
    backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
    opacity:0;pointer-events:none;white-space:nowrap;z-index:999;
    transition:all .45s cubic-bezier(.2,.9,.2,1);
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* ═══════════ CONFETTI ═══════════ */
  .confetti{
    position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:998;
    will-change:transform,opacity;
  }
  .flash{
    position:fixed;width:200px;height:200px;border-radius:50%;
    pointer-events:none;z-index:997;
    transform:translate(-50%,-50%) scale(0);
    background:radial-gradient(circle,var(--c),transparent 65%);
    animation:flashOut .7s ease-out forwards;
  }
  @keyframes flashOut{
    0%{transform:translate(-50%,-50%) scale(0);opacity:.9}
    100%{transform:translate(-50%,-50%) scale(1.8);opacity:0}
  }

  @keyframes up{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}

  @media (max-width:380px){
    .big-ring{width:96px;height:96px}
    .big-ring .center .pct{font-size:26px}
    .b{font-size:10px;padding:10px 2px}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.001ms !important;transition-duration:.001ms !important}
  }

  /* ═══════════ EXTRAS ═══════════ */
  .ic{cursor:pointer}
  .card-top{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
  .quote{max-width:620px;margin:0 auto 16px;text-align:center;font-size:13px;color:var(--dim);line-height:1.9;cursor:pointer;padding:0 8px}
  .wg{max-width:620px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .wg .t{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:18px;padding:12px 4px;text-align:center;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
  .wg b{display:block;font-size:15px;font-weight:800}.wg small{font-size:10.5px;color:var(--dim)}
  .wnext{grid-column:1/-1;font-size:12px;color:var(--dim);text-align:center;cursor:pointer;padding:4px}
  .timer{max-width:620px;margin:0 auto 18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center;padding:12px;border-radius:20px;border:1px solid var(--line);background:rgba(255,255,255,.03)}
  .timer select{font:inherit;font-size:12px;color:var(--text);background:#16161c;border:1px solid var(--line);border-radius:10px;padding:8px;max-width:150px}
  .clock{font-family:'Space Grotesk',monospace;font-size:20px;font-weight:700;min-width:96px;text-align:center}
  .chip{font:inherit;font-size:12px;font-weight:700;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
  .chip.active{color:#fff;border-color:rgba(255,255,255,.25);background:rgba(255,255,255,.08)}
  .chip:disabled{opacity:.35;cursor:default}
  .acts{position:relative;z-index:1;display:flex;gap:6px;margin-top:10px;align-items:center;flex-wrap:wrap}
  .act{font:inherit;font-size:11px;color:var(--dim);background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:10px;padding:7px 10px;cursor:pointer}
  .act.on{color:#fff;border-color:rgba(255,255,255,.25)}
  .act:disabled{opacity:.3}
  .mv{display:none}body.edit .mv{display:inline-block}
  .tt{margin-inline-start:auto;font-size:10.5px;color:var(--dimmer)}
  .panel{position:relative;z-index:1;margin-top:10px}.panel:empty{display:none}
  .panel textarea,.panel input{width:100%;font:inherit;font-size:13px;color:var(--text);background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:12px;padding:10px;resize:vertical}
  .sub{display:flex;align-items:center;gap:8px;padding:5px 2px;font-size:13px}
  .sub span{flex:1;word-break:break-word}.sub.d span{text-decoration:line-through;color:var(--dim)}
  .sub button{background:none;border:0;color:var(--dim);font-size:16px;cursor:pointer;padding:2px 6px}
  .sheet{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center}
  .sheet.show{display:flex}
  .sbox{width:100%;max-width:620px;max-height:80vh;overflow:auto;background:#111116;border:1px solid var(--line);border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom));overscroll-behavior:contain}
  .sbox h3{font-size:15px;margin-bottom:14px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:8px}
  .grid button{font-size:24px;padding:8px;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;cursor:pointer}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .ar{display:flex;gap:10px;align-items:center;padding:8px 0;opacity:.38;font-size:13px}.ar.u{opacity:1}.ar i{font-style:normal;font-size:24px}.ar small{display:block;color:var(--dim);font-size:11px}
  .cele{position:fixed;inset:0;z-index:996;display:grid;place-items:center;pointer-events:none;opacity:0;transition:opacity .4s}
  .cele.show{opacity:1}.cele div{text-align:center;font-size:20px;font-weight:800;text-shadow:0 0 30px #000;padding:20px}
  .cele span{display:block;font-size:64px}
</style>
</head>

  <div class="badge"><span class="pulse"></span> auto-saved</div>

<section class="hero">

<div class="sheet" id="sheet"><div class="sbox"><h3 id="sT"></h3><div id="sB"></div></div></div>

<script>
(function(){
  'use strict';

  /* ═══════════ DATA ═══════════ */
  var STATUS = {
    todo:     { label:'شروع',    value:0,   color:'#52525b' },
    learning: { label:'یادگیری', value:40,  color:'#22d3ee' },
    practice: { label:'تمرین',   value:75,  color:'#a78bfa' },
    done:     { label:'تکمیل',   value:100, color:'#34d399' }
  };
  var ORDER = ['todo','learning','practice','done'];

  var CATEGORIES = [
    { id:'data',   name:'Python & Data',       color:'#22d3ee' },
    { id:'db',     name:'Database & ETL',      color:'#3b82f6' },
    { id:'devops', name:'Backend & DevOps',    color:'#f59e0b' },
    { id:'ml',     name:'ML & Business Intel', color:'#ec4899' }
  ];

  var SKILLS = [
    { id:'numpy',   cat:'data',   name:'NumPy',            icon:'🔢' },
    { id:'pandas',  cat:'data',   name:'Pandas',           icon:'🐼' },
    { id:'mpl',     cat:'data',   name:'Matplotlib',       icon:'📈' },
    { id:'seaborn', cat:'data',   name:'Seaborn',          icon:'🎨' },
    { id:'sql',     cat:'db',     name:'SQL',              icon:'🗄️' },
    { id:'dbase',   cat:'db',     name:'Database',         icon:'💾' },
    { id:'etl',     cat:'db',     name:'ETL',              icon:'🔄' },
    { id:'api',     cat:'devops', name:'API',              icon:'🔌' },
    { id:'docker',  cat:'devops', name:'Docker',           icon:'🐳' },
    { id:'git',     cat:'devops', name:'Git / GitHub',     icon:'🌿' },
    { id:'ml',      cat:'ml',     name:'Machine Learning', icon:'🤖' },
    { id:'powerbi', cat:'ml',     name:'Power BI',         icon:'📊' }
  ];

  var KEY = 'learning-path-v4';
  var state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || '{}') || {}; } catch(e){ state = {}; }

  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function vib(ms){ try{ navigator.vibrate && navigator.vibrate(ms); }catch(e){} }
  function fa(n){ try{ return Number(n).toLocaleString('fa-IR'); }catch(e){ return String(n); } }

  /* ═══════════ EXTRAS: DATA ═══════════ */
  var THEMES = {auto:null, violet:['#7c3aed','#06b6d4','#ec4899'], ocean:['#0ea5e9','#2dd4bf','#6366f1'], sunset:['#f97316','#f43f5e','#facc15'], forest:['#22c55e','#10b981','#84cc16'], rose:['#f43f5e','#ec4899','#a855f7'], mono:['#71717a','#a1a1aa','#52525b']};
  var TNAMES = {auto:'خودکار', violet:'Neon', ocean:'Ocean', sunset:'Sunset', forest:'Forest', rose:'Rose', mono:'Monochrome'};
  var ICAT = {
    'تکنولوژی':'💻 ⌨️ 📱 🖥️ 🔢 📈 📊 🗄️ 💾 🔄 🔌 🐳 🤖 🧠 ⚙️ 🛠️ 🧪 📡 🔐 ☁️ 📦 🧮 🧩 🐍 🌐 🏗️ 🪄 🦾'.split(' '),
    'طبیعت':'🐼 🌿 🌱 🌳 🌸 🌊 🔥 ⚡ ☀️ 🌙 ⭐ 🌈 🦉 🐢 🦋 🍀 🌍 ❄️'.split(' '),
    'نمادها':'🎯 🏁 🚀 💡 📚 📝 🎓 📐 🗂️ 🧭 🏆 🎖️ ✅ ❤️ 💎 🔑 🧱 🎨 🔍 ⏱'.split(' '),
    'صورتک‌ها':'😀 😎 🤓 🤩 🥳 😴 🤔 😤 🥹 🤯 🙂 😇 👾 💪 🙌 👀'.split(' ')
  };
  var ICONS = [].concat.apply([], Object.keys(ICAT).map(function(k){ return ICAT[k]; }));
  var QUOTES = ['هر روز یک قدم کوچک، آخرش یک مسیر بزرگ.','ثبات از شدت مهم‌تر است.','امروز کمی بهتر از دیروز.','شروع کن؛ کامل شدنش بعداً می‌آید.','دانه‌دانه گندم، خرمن می‌شود.','اشتباه کردن یعنی در حال یاد گرفتنی.','پیشرفت یعنی ادامه دادن، حتی وقتی حوصله نداری.','یک ساعت تمرین، بهتر از ده ساعت نگاه کردن.','بزرگ‌ترین پروژه‌ها هم با یک commit شروع شدند.','کد بنویس، خراب کن، دوباره بساز.','کار امروز را به فردا نینداز.','مسیر را ببین، نه فقط مقصد را.'];
  var ACH = [
    {id:'a1',i:'🥉',t:'اولین قدم',d:'اولین مهارت را شروع کن',f:function(s){return s.started>=1;}},
    {id:'a2',i:'🎓',t:'استاد',d:'۵ مهارت را کامل کن',f:function(s){return s.done>=5;}},
    {id:'a3',i:'🧭',t:'نیمه‌راه',d:'پیشرفت کلی ۵۰٪',f:function(s){return s.pct>=50;}},
    {id:'a4',i:'🎖️',t:'استاد یک حوزه',d:'یک دسته را کامل کن',f:function(s){return s.cats>=1;}},
    {id:'a5',i:'🏆',t:'قهرمان',d:'همه‌ی مهارت‌ها تکمیل',f:function(s){return s.pct>=100;}},
    {id:'a6',i:'🔥',t:'سه روز پیاپی',d:'استریک ۳ روزه',f:function(s){return s.streak>=3;}},
    {id:'a7',i:'⚡',t:'هفت روز پیاپی',d:'استریک ۷ روزه',f:function(s){return s.streak>=7;}},
    {id:'a8',i:'🌋',t:'ماه آتشین',d:'استریک ۳۰ روزه',f:function(s){return s.streak>=30;}},
    {id:'a9',i:'⏱',t:'یک ساعت مطالعه',d:'مجموع تایمر ۱ ساعت',f:function(s){return s.sec>=3600;}},
    {id:'b1',i:'⏳',t:'ده ساعت مطالعه',d:'مجموع تایمر ۱۰ ساعت',f:function(s){return s.sec>=36000;}},
    {id:'b2',i:'☑️',t:'چک‌لیست‌باز',d:'۱۰ زیرموضوع انجام‌شده',f:function(s){return s.subs>=10;}},
    {id:'b3',i:'📝',t:'یادداشت‌بردار',d:'اولین یادداشت',f:function(s){return s.notes>=1;}},
    {id:'b5',i:'🚀',t:'سریع',d:'در یک روز ۳ مهارت را جلو ببر',f:function(s){return s.fast;}},
    {id:'b4',i:'🎨',t:'سلیقه‌ای',d:'تم یا آیکون را عوض کن',f:function(s){return s.style;}}
  ];
  var ACTS = '<div class="acts"><button class="act" data-a="note"></button><button class="act" data-a="subs"></button><button class="act" data-a="tm">⏱</button><button class="act mv" data-a="up">▲</button><button class="act mv" data-a="dn">▼</button><span class="tt"></span></div><div class="panel"></div>';

  var XKEY = 'learning-path-x1', ISO = /^\d{4}-\d{2}-\d{2}$/;
  function dk(d){ d = d || new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
  function num(v, max){ v = Number(v); return isFinite(v) && v >= 0 ? Math.min(v, max || 1e9) : 0; }
  function skillOk(id){ return SKILLS.some(function(s){ return s.id === id; }); }
  function cleanState(o){
    var r = {};
    if (o && typeof o === 'object') SKILLS.forEach(function(s){ if (STATUS.hasOwnProperty(o[s.id])) r[s.id] = o[s.id]; });
    return r;
  }
  function normX(o){
    o = o && typeof o === 'object' ? o : {};
    var r = {notes:{},subs:{},order:{},icons:{},time:{},days:{},ach:{},theme:'auto',sort:'manual',sp:'',timer:null,adv:null,ms:0}, k;
    SKILLS.forEach(function(s){
      var id = s.id;
      if (o.notes && typeof o.notes[id] === 'string' && o.notes[id]) r.notes[id] = o.notes[id].slice(0,2000);
      if (o.subs && Array.isArray(o.subs[id])) r.subs[id] = o.subs[id].filter(function(q){ return q && typeof q.t === 'string' && q.t; }).slice(0,30).map(function(q){ return {t:q.t.slice(0,80), d:!!q.d}; });
      if (o.icons && ICONS.indexOf(o.icons[id]) >= 0) r.icons[id] = o.icons[id];
      if (o.time && num(o.time[id])) r.time[id] = num(o.time[id]);
    });
    CATEGORIES.forEach(function(c){
      var a = o.order && o.order[c.id];
      if (Array.isArray(a)) r.order[c.id] = a.filter(function(id, i){ return a.indexOf(id) === i && SKILLS.some(function(s){ return s.id === id && s.cat === c.id; }); });
    });
    if (o.days && typeof o.days === 'object') for (k in o.days) if (ISO.test(k) && o.days[k] && typeof o.days[k] === 'object') r.days[k] = {m:num(o.days[k].m, 86400)};
    ACH.forEach(function(a){ if (o.ach && typeof o.ach[a.id] === 'string') r.ach[a.id] = o.ach[a.id].slice(0,10); });
    if (THEMES.hasOwnProperty(o.theme)) r.theme = o.theme;
    if (['manual','prog','name'].indexOf(o.sort) >= 0) r.sort = o.sort;
    if (typeof o.sp === 'string') r.sp = o.sp.slice(0,40);
    if (o.adv && typeof o.adv === 'object' && ISO.test(o.adv.d) && Array.isArray(o.adv.ids)) r.adv = {d:o.adv.d, ids:o.adv.ids.filter(skillOk).slice(0,20)};
    if ([25,50,75,100].indexOf(o.ms) >= 0) r.ms = o.ms;
    var t = o.timer;
    if (t && typeof t === 'object' && skillOk(t.sid)) r.timer = {sid:t.sid, run:!!t.run, st:num(t.st,1e14), acc:num(t.acc,43200000)};
    return r;
  }
  state = cleanState(state);
  var x;
  try { x = normX(JSON.parse(localStorage.getItem(XKEY) || '{}')); } catch(e){ x = normX({}); }
  function saveX(){ try{ localStorage.setItem(XKEY, JSON.stringify(x)); }catch(e){} }

  function valOf(id){
    var l = x.subs[id] || [];
    return l.length ? Math.round(l.filter(function(q){ return q.d; }).length * 100 / l.length) : STATUS[state[id] || 'todo'].value;
  }
  function stOf(id){
    var l = x.subs[id];
    if (l && l.length){ var v = valOf(id); return v >= 100 ? 'done' : v >= 75 ? 'practice' : v > 0 ? 'learning' : 'todo'; }
    return state[id] || 'todo';
  }
  function fmtDur(sec){
    var m = Math.floor(sec/60);
    if (m < 60) return fa(m) + ' دقیقه';
    var h = Math.floor(m/60);
    return fa(h) + ' ساعت' + (m % 60 ? ' و ' + fa(m % 60) + ' دقیقه' : '');
  }
  function streak(){
    var d = new Date(); d.setHours(12,0,0,0);
    if (!x.days[dk(d)]) d.setDate(d.getDate() - 1);
    var n = 0;
    while (x.days[dk(d)] && n < 3660){ n++; d.setDate(d.getDate() - 1); }
    return n;
  }
  function stats(){
    var s = {done:0,total:0,cats:0,subs:0,notes:0,sec:0,started:0}, c = {};
    SKILLS.forEach(function(k){
      var v = valOf(k.id);
      s.total += v;
      if (v > 0) s.started++;
      if (v === 100){ s.done++; c[k.cat] = (c[k.cat] || 0) + 1; }
      (x.subs[k.id] || []).forEach(function(q){ if (q.d) s.subs++; });
      if (x.notes[k.id]) s.notes++;
      s.sec += x.time[k.id] || 0;
    });
    CATEGORIES.forEach(function(g){
      if (c[g.id] === SKILLS.filter(function(k){ return k.cat === g.id; }).length) s.cats++;
    });
    s.pct = Math.round(s.total / SKILLS.length);
    s.streak = streak();
    s.fast = !!(x.adv && x.adv.d === dk() && x.adv.ids.length >= 3);
    s.style = x.theme !== 'auto' || Object.keys(x.icons).length > 0;
    return s;
  }
  function markActive(sec){
    var k = dk(), b = streak();
    if (!x.days[k]) x.days[k] = {m:0};
    x.days[k].m = Math.min(86400, x.days[k].m + (sec || 0));
    saveX();
    var a = streak();
    if (a > b && [3,7,14,30,50,100,365].indexOf(a) >= 0) celebrate('🔥', 'استریک ' + fa(a) + ' روزه!');
  }
  function checkAch(silent){
    var s = stats(), n = [];
    ACH.forEach(function(a){ if (!x.ach[a.id] && a.f(s)){ x.ach[a.id] = dk(); n.push(a); } });
    if (n.length){
      saveX(); renderWidget();
      if (!silent) showToast(n[0].i + ' نشان جدید: ' + n[0].t + (n.length > 1 ? ' +' + fa(n.length - 1) : ''));
    }
  }
  function flags(){
    var f = {all:true, c:{}, pct:0}, t = 0;
    SKILLS.forEach(function(k){ t += valOf(k.id); });
    f.pct = Math.floor(t / SKILLS.length);
    CATEGORIES.forEach(function(g){
      f.c[g.id] = SKILLS.every(function(k){ return k.cat !== g.id || stOf(k.id) === 'done'; });
      if (!f.c[g.id]) f.all = false;
    });
    return f;
  }
  function afterStatus(id, oldV, pre){
    if (valOf(id) > oldV){
      markActive(0);
      var k = dk(); if (!x.adv || x.adv.d !== k) x.adv = {d:k, ids:[]};
      if (x.adv.ids.indexOf(id) < 0) x.adv.ids.push(id);
      saveX();
    }
    var f = flags(), hit = 0;
    [25,50,75,100].forEach(function(t){ if (pre.pct < t && f.pct >= t && t > x.ms) hit = t; });
    if (hit){
      x.ms = hit; saveX();
      celebrate(hit === 100 ? '🏆' : '🎉', hit === 100 ? 'همه‌ی مهارت‌ها تکمیل شد!' : 'پیشرفت کلی به ' + fa(hit) + '٪ رسید!', true);
    } else CATEGORIES.forEach(function(g){ if (f.c[g.id] && !pre.c[g.id]) celebrate('🎉', g.name + ' کامل شد!'); });
    checkAch();
  }
  var ct;
  function celebrate(ic, msg, big){
    var el = document.getElementById('cele');
    document.getElementById('cI').textContent = ic;
    document.getElementById('cM').textContent = msg;
    el.classList.add('show');
    for (var i = 0; i < (big ? 6 : 2); i++){
      (function(i){ setTimeout(function(){ burstAt(innerWidth * (.2 + .6 * Math.random()), innerHeight * (.25 + .3 * Math.random()), 28); }, i * 250); })(i);
    }
    clearTimeout(ct);
    ct = setTimeout(function(){ el.classList.remove('show'); }, 3200);
    vib([20,40,30]);
  }

  /* ═══════════ BACKGROUND COLORS BY PROGRESS ═══════════ */
  var AURORA_STOPS = [
    // [progress, a1, a2, a3]
    [0,   '#7c3aed', '#06b6d4', '#ec4899'],
    [40,  '#22d3ee', '#a78bfa', '#f472b6'],
    [70,  '#a78bfa', '#34d399', '#22d3ee'],
    [100, '#34d399', '#22d3ee', '#a78bfa']
  ];

  function hexToRgb(h){
    h = h.replace('#','');
    return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
  }
  function mixColor(a, b, t){
    var A = hexToRgb(a), B = hexToRgb(b);
    var r = Math.round(A[0]+(B[0]-A[0])*t);
    var g = Math.round(A[1]+(B[1]-A[1])*t);
    var bl = Math.round(A[2]+(B[2]-A[2])*t);
    return 'rgb('+r+','+g+','+bl+')';
  }
  function auroraColorAt(prog){
    var T = THEMES[x.theme]; if (T) return T;
    for (var i = 0; i < AURORA_STOPS.length - 1; i++){
      var a = AURORA_STOPS[i], b = AURORA_STOPS[i+1];
      if (prog >= a[0] && prog <= b[0]){
        var t = (prog - a[0]) / (b[0] - a[0]);
        return [mixColor(a[1],b[1],t), mixColor(a[2],b[2],t), mixColor(a[3],b[3],t)];
      }
    }
    var last = AURORA_STOPS[AURORA_STOPS.length-1];
    return [last[1],last[2],last[3]];
  }

  function updateBackground(prog){
    var c = auroraColorAt(prog);
    var root = document.documentElement.style;
    root.setProperty('--a1', c[0]);
    root.setProperty('--a2', c[1]);
    root.setProperty('--a3', c[2]);
    // شفافیت aurora بیشتر بشه وقتی پیشرفت بالا میره
    document.querySelector('.aurora').style.opacity = 0.4 + (prog/100) * 0.25;
  }

  /* ═══════════ BUILD UI ═══════════ */
  var container = document.getElementById('container');
  var activeFilter = 'all';

  // Sections
  CATEGORIES.forEach(function(cat){
    var section = document.createElement('section');
    section.className = 'section';
    section.dataset.cat = cat.id;
    section.style.setProperty('--cat-color', cat.color);

    var head = document.createElement('div');
    head.className = 'section-head';
    head.style.animationDelay = '0.15s';
    head.innerHTML =
      '<span class="bar"></span>' +
      '<h2>'+cat.name+'</h2>' +
      '<span class="cnt" data-cnt="'+cat.id+'">0/0</span>';
    section.appendChild(head);

    SKILLS.filter(function(s){ return s.cat === cat.id; }).forEach(function(skill){
      section.appendChild(buildCard(skill, cat));
    });

    container.appendChild(section);
  });

  function buildCard(skill, cat){
    var card = document.createElement('article');
    card.className = 'card';
    card.dataset.id = skill.id;
    card.style.setProperty('--cat', cat.color);

    var btns = ORDER.map(function(k){
      return '<button class="b" data-st="'+k+'" style="--bc:'+STATUS[k].color+'">'+STATUS[k].label+'</button>';
    }).join('');

    card.innerHTML =
      '<div class="card-top">' +
        '<div class="ic">'+skill.icon+'</div>' +
        '<div class="info">' +
          '<h3>'+skill.name+'</h3>' +
          '<span class="stat-line">شروع</span>' +
        '</div>' +
        '<div class="mini-ring">' +
          '<svg viewBox="0 0 52 52">' +
            '<circle class="t" cx="26" cy="26" r="23"/>' +
            '<circle class="f" cx="26" cy="26" r="23"/>' +
          '</svg>' +
          '<span class="n">0</span>' +
        '</div>' +
      '</div>' +

      var v = Math.round(from + (to - from) * eased);
      el.textContent = fa(v);
      if (p < 1) requestAnimationFrame(tick);

    requestAnimationFrame(tick);
  }

    var colors = ['#34d399','#22d3ee','#a78bfa','#f0abfc','#fbbf24','#ffffff'];
    for (var i = 0; i < count; i++){
      (function(i){
        var p = document.createElement('div');
        p.className = 'confetti';
        var col = colors[i % colors.length];
        p.style.background = col;
        p.style.left = cx + 'px';
        p.style.top = cy + 'px';
        p.style.borderRadius = Math.random() > .5 ? '50%' : '2px';
        p.style.boxShadow = '0 0 14px ' + col;
        document.body.appendChild(p);

        var angle = (Math.PI * 2 * i) / count + Math.random() * .6;
        var dist = 100 + Math.random() * 160;
        var dx = Math.cos(angle) * dist;
        var dy = Math.sin(angle) * dist - 50;
        var rot = Math.random() * 900 - 450;

        p.animate([
          { transform:'translate(0,0) rotate(0) scale(1)', opacity:1 },
          { transform:'translate('+dx+'px,'+dy+'px) rotate('+rot+'deg) scale(.15)', opacity:0 }
        ], {
          duration: 1000 + Math.random() * 500,
          easing: 'cubic-bezier(.15,.6,.4,1)'
        }).onfinish = function(){ p.remove(); };
      })(i);
    }
  }

      rs.addEventListener('click', function(){ delete x.icons[id]; saveX(); xCard(cardOf(id)); renderWidget(); closeSheet(); });
      b.appendChild(rs);
    });
  }
  document.getElementById('themeBtn').addEventListener('click', themeSheet);
  document.getElementById('achBtn').addEventListener('click', function(){
    openSheet('نشان‌ها و دستاوردها', function(b){
      ACH.forEach(function(a){
        var r = mk('div', 'ar' + (x.ach[a.id] ? ' u' : '')), d = mk('div');
        d.appendChild(mk('div', '', a.t)); d.appendChild(mk('small', '', a.d));
        r.appendChild(mk('i', '', a.i)); r.appendChild(d); b.appendChild(r);
      });
    });
  });

  /* quote + special days */
  var qEl = document.getElementById('quote'), td = new Date();
  var qi = Math.floor(Date.UTC(td.getFullYear(), td.getMonth(), td.getDate()) / 864e5) % QUOTES.length;
  function showQuote(){ qEl.textContent = '“' + QUOTES[qi] + '”'; }
  qEl.addEventListener('click', function(){ qi = (qi + 1) % QUOTES.length; showQuote(); });
  showQuote();
  function pDate(){
    try {
      var m = 0, d = 0;
      new Intl.DateTimeFormat('en-u-ca-persian-nu-latn', {month:'numeric', day:'numeric'}).formatToParts(new Date()).forEach(function(q){
        if (q.type === 'month') m = parseInt(q.value, 10);
        if (q.type === 'day') d = parseInt(q.value, 10);
      });
      return m && d ? {m:m, d:d} : null;
    } catch(e){ return null; }
  }
  function specialDay(){
    var k = dk(); if (x.sp === k) return;
    var d = new Date(), p = pDate(), hit = null;
    if (d.getMonth() === 0 && d.getDate() === 1) hit = ['🎆', 'سال نو میلادی مبارک!'];
    if (p && p.m === 1 && p.d === 1) hit = ['🌱', 'نوروزت پیروز!'];
    if (p && p.m === 9 && p.d === 30) hit = ['🍉', 'شب یلدا مبارک!'];
    if (hit){ x.sp = k; saveX(); celebrate(hit[0], hit[1], true); }
  }

  function refreshAll(){
    openP = {};
    document.querySelectorAll('.card').forEach(function(c){ apply(c, stOf(c.dataset.id), true); renderPanel(c); });
    reorder(); setSortUI(); updateOverall(); renderTimer();
  }
  reorder(); setSortUI(); renderTimer(); renderWidget(); checkAch(true);
  setTimeout(specialDay, 1500);

  /* ═══════════ SERVICE WORKER ═══════════ */
  if ('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('sw.js').catch(function(){});
    });
  }

})();
</script>
